<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Type of Forms </title>
</head>

<body>

    <!-- Standard Registration Form-->
    <form method="post">
        <fieldset>
            <legend>Registration Form </legend>

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name " name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter your E-mail" name="name" required><br><br>

            <label for="pass">Password:</label>
            <input type="text" id="name" placeholder="Enter your Password" name="pass" required><br><br>

            <label for="gender">Gender:</label>
            <input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">Female<br><br>

            <label>Skills</label>
            <input type="checkbox" value="html">Html
            <input type="checkbox" value="css">Css
            <input type="checkbox" value="js">Js
            <input type="checkbox" value="python">Python <br><br>

            <label>Country </label>
            <select name="country">
                <option>Please select any</option>
                <option>Algeria</option>
                <option>Bangladesh</option>
                <option>India</option>
                <option>Uk</option>
            </select><br><br>

            <label>Message:</label><br><br>
            <textarea rows="4" cols="30"></textarea><br><br>

            <input type="submit" value="Register">
            <input type="reset">
        </fieldset>
    </form><br>
</body>

</html>
